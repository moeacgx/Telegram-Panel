name: Release (Auto Changelog)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v1.2.3）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout source at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.tag }}

      - name: Validate release tag version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${{ steps.vars.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PROJECT_VERSION="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          if [[ -z "$PROJECT_VERSION" || "$PROJECT_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match Directory.Build.props version $PROJECT_VERSION" >&2
            exit 1
          fi

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.20.0 --activate

      - name: Test and build Vue admin
        shell: bash
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run test
          pnpm --dir frontend run build

      - name: Restore
        run: dotnet restore tests/TelegramPanel.Web.Tests/TelegramPanel.Web.Tests.csproj

      - name: Test persistent storage and self update
        run: dotnet test tests/TelegramPanel.Web.Tests/TelegramPanel.Web.Tests.csproj -c Release --no-restore

      - name: Publish Linux update packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/TelegramPanel.Web/TelegramPanel.Web.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -p:UseAppHost=false \
            -o artifacts/linux-x64

          dotnet publish src/TelegramPanel.Web/TelegramPanel.Web.csproj \
            -c Release \
            -r linux-arm64 \
            --self-contained false \
            -p:UseAppHost=false \
            -o artifacts/linux-arm64

          for target in artifacts/linux-x64 artifacts/linux-arm64; do
            test -f "$target/self-update/entrypoint.sh"
            cmp -s docker/entrypoint.sh "$target/self-update/entrypoint.sh"
            sh -n "$target/self-update/entrypoint.sh"
            if LC_ALL=C grep -q $'\r' "$target/self-update/entrypoint.sh"; then
              echo "entrypoint.sh contains CRLF: $target" >&2
              exit 1
            fi

            leaked="$(find "$target" -type f \( \
              -name 'telegram-panel.db' -o \
              -name 'telegram_panel.db' -o \
              -name 'admin_auth.json' -o \
              -name 'admin-bootstrap-password.txt*' -o \
              -name 'admin_auth.json.*.tmp' -o \
              -name 'appsettings.local.json' -o \
              -name '*.session' \
            \) -print -quit)"
            if [[ -n "$leaked" ]]; then
              echo "persistent user data leaked into release: $leaked" >&2
              exit 1
            fi
          done

      - name: Pack release assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          mkdir -p dist

          X64_ZIP="telegram-panel-${TAG}-linux-x64.zip"
          ARM64_ZIP="telegram-panel-${TAG}-linux-arm64.zip"

          (cd artifacts/linux-x64 && zip -rq "../../dist/${X64_ZIP}" .)
          (cd artifacts/linux-arm64 && zip -rq "../../dist/${ARM64_ZIP}" .)

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: dist/*
          if-no-files-found: error

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout source at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.20.0 --activate

      - name: Build Vue admin
        shell: pwsh
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run build

      - name: Build Windows installer
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools\desktop\build-windows-installer.ps1

      - name: Pack Windows release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $tag = "${{ needs.prepare.outputs.tag }}"
          Copy-Item -LiteralPath artifacts\desktop\TelegramPanel.Setup.exe -Destination "dist\telegram-panel-$tag-windows-x64-setup.exe" -Force

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist/*
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Test release notes generator
        run: timeout 60s python3 -m unittest discover -s tools/tests -p 'test_release_notes.py' -v

      - name: Generate Chinese release notes
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 tools/release_notes.py \
            --tag "$RELEASE_TAG" \
            --repository "$RELEASE_REPOSITORY" \
            --output release-notes.md

      - name: Save generated release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

      - name: Create GitHub Release with Chinese changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          files: |
            dist/*
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md

      - name: Verify published release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --json name,body > published-release.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          actual = json.loads(Path("published-release.json").read_text(encoding="utf-8"))
          expected = Path("release-notes.md").read_text(encoding="utf-8")
          assert actual["name"] == os.environ["RELEASE_TAG"], "Release title differs from tag"
          assert actual["body"].replace("\r\n", "\n").strip() == expected.strip(), "Release body differs from generated notes"
          PY
