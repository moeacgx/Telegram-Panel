name: Release (Auto Changelog)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v1.2.3）"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Resolve tag name
        id: vars
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout source at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.vars.outputs.tag }}

      - name: Validate release tag version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${{ steps.vars.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PROJECT_VERSION="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props | head -n 1)"
          if [[ -z "$PROJECT_VERSION" || "$PROJECT_VERSION" != "$TAG_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match Directory.Build.props version $PROJECT_VERSION" >&2
            exit 1
          fi

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@10.20.0 --activate

      - name: Test and build Vue admin
        shell: bash
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run test
          pnpm --dir frontend run build

      - name: Restore
        run: dotnet restore tests/TelegramPanel.Web.Tests/TelegramPanel.Web.Tests.csproj

      - name: Test persistent storage and self update
        run: dotnet test tests/TelegramPanel.Web.Tests/TelegramPanel.Web.Tests.csproj -c Release --no-restore

      - name: Publish Linux update packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/TelegramPanel.Web/TelegramPanel.Web.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained false \
            -p:UseAppHost=false \
            -o artifacts/linux-x64

          dotnet publish src/TelegramPanel.Web/TelegramPanel.Web.csproj \
            -c Release \
            -r linux-arm64 \
            --self-contained false \
            -p:UseAppHost=false \
            -o artifacts/linux-arm64

          for target in artifacts/linux-x64 artifacts/linux-arm64; do
            test -f "$target/self-update/entrypoint.sh"
            cmp -s docker/entrypoint.sh "$target/self-update/entrypoint.sh"
            sh -n "$target/self-update/entrypoint.sh"
            if LC_ALL=C grep -q $'\r' "$target/self-update/entrypoint.sh"; then
              echo "entrypoint.sh contains CRLF: $target" >&2
              exit 1
            fi

            leaked="$(find "$target" -type f \( \
              -name 'telegram-panel.db' -o \
              -name 'telegram_panel.db' -o \
              -name 'admin_auth.json' -o \
              -name 'appsettings.local.json' -o \
              -name '*.session' \
            \) -print -quit)"
            if [[ -n "$leaked" ]]; then
              echo "persistent user data leaked into release: $leaked" >&2
              exit 1
            fi
          done

      - name: Pack release assets
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          mkdir -p dist

          X64_ZIP="telegram-panel-${TAG}-linux-x64.zip"
          ARM64_ZIP="telegram-panel-${TAG}-linux-arm64.zip"

          (cd artifacts/linux-x64 && zip -rq "../../dist/${X64_ZIP}" .)
          (cd artifacts/linux-arm64 && zip -rq "../../dist/${ARM64_ZIP}" .)

      - name: Upload Linux release assets
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: dist/*
          if-no-files-found: error

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout source at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        shell: pwsh
        run: |
          corepack enable
          corepack prepare pnpm@10.20.0 --activate

      - name: Build Vue admin
        shell: pwsh
        run: |
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend run build

      - name: Build Windows installer
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tools\desktop\build-windows-installer.ps1

      - name: Pack Windows release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $tag = "${{ needs.prepare.outputs.tag }}"
          Copy-Item -LiteralPath artifacts\desktop\TelegramPanel.Setup.exe -Destination "dist\telegram-panel-$tag-windows-x64-setup.exe" -Force

      - name: Upload Windows release assets
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist/*
          if-no-files-found: error

  release:
    needs:
      - prepare
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate Chinese release notes
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          PREVIOUS_TAG="$(git tag --sort=-v:refname | grep -E '^v[0-9]+' | grep -v "^${TAG}$" | head -n 1 || true)"
          RANGE="$TAG"
          if [[ -n "$PREVIOUS_TAG" ]]; then RANGE="${PREVIOUS_TAG}..${TAG}"; fi

          {
            echo "## 本次版本主要更新"
            echo
            mapfile -t COMMITS < <(git log --no-merges --format='%s%x09%h' "$RANGE" | sed '/^[[:space:]]*$/d' || true)
            if [[ "${#COMMITS[@]}" -eq 0 ]]; then
              echo "- 维护发布：同步构建产物与部署资产。"
              echo
            else
              declare -A SECTIONS=( [feat]="✨ 新增功能" [fix]="🐛 修复问题" [perf]="⚡ 性能优化" [docs]="📚 文档更新" [refactor]="🧹 代码重构" [test]="✅ 测试改进" [build]="📦 构建发布" [ci]="🔧 CI/CD" [release]="🚀 版本发布" [chore]="🧩 其他变更" [other]="🧩 其他变更" )
              TYPES=(feat fix perf docs refactor test build ci release chore other)
              declare -A BUCKETS
              for item in "${COMMITS[@]}"; do
                subject="${item%$'\t'*}"
                sha="${item##*$'\t'}"
                type="other"
                title="$subject"
                if [[ "$subject" == *:* ]]; then
                  prefix="${subject%%:*}"
                  title="${subject#*:}"
                  raw_type="${prefix%%(*}"
                  raw_type="${raw_type%!}"
                  raw_type="${raw_type,,}"
                  case "$raw_type" in feat|fix|perf|docs|refactor|test|build|ci|release|chore) type="$raw_type" ;; *) type="other" ;; esac
                fi
                title="$(echo "$title" | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')"
                [[ -z "$title" ]] && title="$subject"
                BUCKETS[$type]+=$'- '"$title"$' (`'"$sha"$'`)\n'
              done
              for type in "${TYPES[@]}"; do
                if [[ -n "${BUCKETS[$type]:-}" ]]; then
                  echo "### ${SECTIONS[$type]}"
                  echo
                  printf '%s' "${BUCKETS[$type]}"
                  echo
                fi
              done
            fi
            if [[ -n "$PREVIOUS_TAG" ]]; then
              echo "完整变更记录： https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${TAG}"
              echo
            fi
            echo "> [!WARNING]"
            echo "> 如果当前账号列表已在旧版一键更新后变空，请勿直接再次点击一键更新。"
            echo "> 先停止容器并备份宿主机 \`docker-data\` 与容器内 \`/app\`；本版可以恢复仍存在的旧库，"
            echo "> 但无法重新生成已经被旧更新器或人工操作删除的文件。"
            echo
            echo "## 部署与更新"
            echo
            echo "### 1. Docker 镜像"
            echo "拉取对应 tag 的镜像："
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository }}:${TAG}"
            echo '```'
            echo
            echo "### 2. 面板内一键更新（Docker）"
            echo "路径：\`左上角版本号 -> 版本信息弹窗 -> 一键更新并重启\`"
            echo
            echo "### 3. Windows 桌面版"
            echo "下载 \`telegram-panel-${TAG}-windows-x64-setup.exe\` 安装包。"
            echo
            echo "## 应用内更新资产"
            echo
            echo "- \`telegram-panel-${TAG}-linux-x64.zip\`"
            echo "- \`telegram-panel-${TAG}-linux-arm64.zip\`"
            echo "- \`telegram-panel-${TAG}-windows-x64-setup.exe\`"
            echo
            echo "> 程序会自动匹配容器架构下载更新包，并部署到 \`/data/app-current\`。"
          } > release-notes.md


      - name: Create GitHub Release with Chinese changelog
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ contains(needs.prepare.outputs.tag, '-') }}
          files: |
            dist/*
          body_path: release-notes.md
